services:
  vulcain:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vulcain
    restart: unless-stopped
    ports:
      - "7331:7331"
    volumes:
      - ${HOME}/vulcain/workspaces:/data/workspaces
      - vulcain-config:/data/.vulcain
      - vulcain-pi:/data/.pi
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  vulcain-config:
  vulcain-pi:
